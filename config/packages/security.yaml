# To get started with security, check out the documentation:
# https://symfony.com/doc/current/security.html
security:
    password_hashers:
        App\Entity\Utilisateur: auto

    # https://symfony.com/doc/current/security.html#b-configuring-how-users-are-loaded
    providers:
        #Connexion par identifiant ou e-mail (cf. UtilisateurRepository::loadUserByIdentifier)
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur

    firewalls:
        # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        principal:
            pattern: ^/
            provider: utilisateurs
            form_login:
                login_path: connexion
                check_path: connexion_verification
                enable_csrf: true
                always_use_default_target_path: true
                default_target_path: admin
                provider: utilisateurs
            logout:
                path: deconnexion
                target: connexion
            user_checker: App\Security\VerificationLogin
            # activate different ways to authenticate
    access_control:
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/register, role: PUBLIC_ACCESS }
        - { path: ^/resetting, role: PUBLIC_ACCESS }
        - { path: ^/admin/, role: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/admin, role: IS_AUTHENTICATED_REMEMBERED }
            # https://symfony.com/doc/current/security.html#a-configuring-how-your-users-will-authenticate
            #http_basic: ~

            # https://symfony.com/doc/current/security/form_login_setup.html
            #form_login: ~
