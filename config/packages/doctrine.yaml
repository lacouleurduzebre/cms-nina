parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # configure these for your database server
        driver: 'pdo_mysql'
        #Version du serveur MySQL de production (version complète, cf. DBAL 4)
        server_version: '5.7.9'
        charset: utf8mb4

        # With Symfony 3.3, remove the `resolve:` prefix
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        #Aucun contrôleur ne reçoit d'entité en argument
        controller_resolver:
            auto_mapping: false
        naming_strategy: 'App\Service\NamingStrategy'
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Theme:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/themes'
                prefix: 'Theme'
                alias: Theme
