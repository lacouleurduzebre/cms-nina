parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # configure these for your database server
        driver: 'pdo_mysql'
        #Version du serveur MySQL de production (version complète, cf. DBAL 4)
        server_version: '5.7.9'
        charset: utf8mb4

        # With Symfony 3.3, remove the `resolve:` prefix
        url: '%env(resolve:DATABASE_URL)%'

        #Type "array" (tableau PHP sérialisé) supprimé de DBAL 4
        types:
            array: App\Doctrine\Type\TableauSerialiseType
    orm:
        naming_strategy: 'App\Service\NamingStrategy'
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
            Theme:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/themes'
                prefix: 'Theme'
