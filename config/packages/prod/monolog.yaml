monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            #Les erreurs 404 ne sont pas enregistrées
            excluded_http_codes: [404]
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
        console:
            type:   console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
