#FOSUser
fos_user_security:
    resource: "@FOSUserBundle/Resources/config/routing/security.xml"

fos_user_profile:
    resource: "@FOSUserBundle/Resources/config/routing/profile.xml"
    prefix: /profile

#fos_user_register:
#    resource: "@FOSUserBundle/Resources/config/routing/registration.xml"
#    prefix: /register

fos_user_resetting:
    resource: "@FOSUserBundle/Resources/config/routing/resetting.xml"
    prefix: /resetting

fos_user_change_password:
    resource: "@FOSUserBundle/Resources/config/routing/change_password.xml"
    prefix: /profile

theme:
    resource: "../themes"
    type: attribute

blocs:
    resource: "../src/Blocs"
    type: attribute

bloc:
    resource: "../src/Controller/Back/BlocController.php"
    type: attribute

sitemap:
    resource: "../src/Controller/SitemapController.php"
    type: attribute

rss:
    resource: "../src/Controller/RSSController.php"
    type: attribute

controllersBack:
    resource: "../src/Controller/Back"
    type: attribute

admin:
    resource: "../src/Controller/Admin"
    type: attribute

#EasyAdmin (pretty URLs) : routes du tableau de bord et des CRUD (/admin/page/1/edit...).
#Après les contrôleurs du back-office, pour que leurs routes sous /admin (ex : /admin/menu/enregistrer) restent
#prioritaires sur les routes génériques des CRUD (ex : /admin/menu/{entityId}), et avant les routes du front (ex : /{url})
easyadmin_routes:
    resource: .
    type: easyadmin.routes

SEO:
    resource: "../src/Controller/SEOController.php"
    type: attribute

langue:
    resource: "../src/Controller/LangueController.php"
    type: attribute

accueil:
    resource: "../src/Controller/AccueilController.php"
    type: attribute

categorie:
    resource: "../src/Controller/CategorieController.php"
    type: attribute

page:
    resource: "../src/Controller/PageController.php"
    type: attribute
